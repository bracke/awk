name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  warm-i18n-cache:
    name: Warm i18n upstream cache
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Check out awk
        uses: actions/checkout@v7
        with:
          path: awk

      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: awk

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build awk to populate generated dependency data
        working-directory: awk
        run: alr --non-interactive build

  native-build-and-test:
    name: native build/test (${{ matrix.os }})
    needs: warm-i18n-cache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # gnat_native=15.2.1 ships no aarch64-darwin binary, so use Intel macOS.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out awk
        uses: actions/checkout@v7
        with:
          path: awk

      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: awk

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Install OpenSSL for macOS C bridges
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "CPATH=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install OpenSSL for Windows C bridges
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          packages="mingw-w64-x86_64-openssl"
          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=no
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 5
          done

          if [ "$synced" != yes ]; then
            echo "::warning::signed pacman sync failed; retrying without signature checks"
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"
              sleep 5
            done
          fi

          if [ "$synced" != yes ]; then
            echo "::error::failed to install MSYS2 OpenSSL development package"
            exit 1
          fi

          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Raise Alire solver timeout
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build awk
        working-directory: awk
        run: alr --non-interactive build

      - name: Build and run AUnit suite
        working-directory: awk/tests
        shell: bash
        run: |
          alr --non-interactive build
          if [ -f ./bin/awk_tests_main.exe ]; then
            ./bin/awk_tests_main.exe
          else
            ./bin/awk_tests_main
          fi

  linux-release-check:
    name: Linux release checklist
    needs: warm-i18n-cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Check out awk
        uses: actions/checkout@v7
        with:
          path: awk

      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: awk

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build workflow executable
        working-directory: awk/tests
        run: alr --non-interactive build

      - name: Run release workflow
        working-directory: awk/tests
        run: ./bin/awk_workflows release
